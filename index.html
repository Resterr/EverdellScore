<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Everdell: App of Scoring</title>
    <meta name="description" content="Everdell: App of Scoring">
    <meta name="author" content="Tade Barthler (original), fork contributors">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" sizes="192x192" href="img/icons/icon_192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/icons/icon_32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="img/icons/icon_96.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/i18next/8.1.0/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@1.3.1/i18nextHttpBackend.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/i18next-browser-languagedetector/6.1.5/i18nextBrowserLanguageDetector.min.js"
        integrity="sha512-Ih6s+CnuvIm8c0ve1oyco5GwQHRTKK7rvDdg8Vr99RWtE+llPXU9ieKm9J8NimyUAJoGrnV0k88fG0uUsCQh2w=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/tally.css">
</head>

<body class="tally-page">
    <header>
        <img src="img/everdell_logo.png" alt="Everdell" class="tally-logo">
        <div id="header-right">
            <select id="lang-select" class="form-select form-select-sm" aria-label="Language">
                <option value="en">English</option>
                <option value="pl">Polski</option>
                <option value="de">Deutsch</option>
                <option value="es">Español</option>
                <option value="nl">Nederlands</option>
                <option value="pt">Brasil português</option>
            </select>
            <a href="cards.html" class="btn btn-sm btn-secondary" data-i18n="gen.mode_cards"></a>
        </div>
    </header>

    <main id="tally" class="container-fluid tally">
        <details id="tally-settings" class="card">
            <summary class="card-header">
                <img src="img/expansions.png" alt="" width="24" height="24"><span data-i18n="tally.settings"></span>
            </summary>
            <div class="card-body">
                <div class="mb-2">
                    <div class="form-label" data-i18n="gen.playercount"></div>
                    <div id="player-count" class="btn-group w-100" role="group"></div>
                </div>
                <div class="mb-2">
                    <div class="form-label" data-i18n="tally.names"></div>
                    <div id="player-names" class="names-grid"></div>
                </div>
                <div class="mb-2">
                    <div class="form-label" data-i18n="gen.expansions"></div>
                    <div id="tally-expansions"></div>
                </div>
                <button id="btn-newgame" type="button" class="btn btn-danger" data-i18n="tally.newgame"></button>
            </div>
        </details>

        <div id="tally-head" class="tally-grid" aria-live="polite"></div>

        <p class="tally-hint" data-i18n="tally.hint"></p>

        <div id="tally-body"></div>

        <div class="tally-actions">
            <button id="btn-results" type="button" class="btn btn-warning btn-lg w-100" data-i18n="tally.results"></button>
        </div>

        <div id="results-modal" class="modal fade" tabindex="-1" aria-labelledby="results-title">
            <div class="modal-dialog modal-dialog-scrollable modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 id="results-title" class="modal-title" data-i18n="tally.results"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-title="tally.close"></button>
                    </div>
                    <div class="modal-body">
                        <p id="results-headline" class="results-headline"></p>
                        <div class="table-responsive">
                            <table id="results-table" class="table table-sm table-bordered results-table"></table>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="tally.close"></button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div id="developmentlink">
            <p>Fork of <a href="https://github.com/tadeaustria/EverdellScore">EverdellScore</a> by Tade Barthler,
                licensed under <a href="LICENSE">GPL-3.0</a>. Modified: category scoring mode, 1–6 players.
                Source: <a href="https://github.com/Resterr/EverdellScore">github.com/Resterr/EverdellScore</a>.</p>
            <p>If you want to help adding your language, find the <a href="i18n/en/translation.json">English template here</a>.</p>
        </div>
        <div id="version">
            <p>v2.0.0</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
        crossorigin="anonymous"></script>
    <script src="src/i18n-init.js"></script>
    <script src="src/players-store.js"></script>
    <script src="src/tally.js"></script>
</body>

</html>
